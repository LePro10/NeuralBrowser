[package]
name = "neural_core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NeuralBrowser platform-independent core (storage, input resolution, shield, vault)"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi = { workspace = true }
rusqlite = { version = "0.42", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
adblock = { version = "0.13.5", default-features = false, features = ["content-blocking", "css-validation"] }
serde_json = "1"
# vault (Vaultwarden/Bitwarden client core); crate choice and versions follow rbw 1.15.0,
# see core/README.md "Vault" for the reason of each.
aes = "0.8.4"
argon2 = "0.5.3"
arrayvec = "0.7.6"
base64 = "0.22.1"
block-padding = "0.3.3"
cbc = { version = "0.1.2", features = ["alloc", "std"] }
hkdf = "0.12.4"
hmac = { version = "0.12.1", features = ["std"] }
pbkdf2 = "0.12.2"
pkcs8 = "0.10.2"
rand = "0.9.2"
region = "3.0.2"
rsa = "0.9.9"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10.6"
sha2 = "0.10.9"
url = "2.5"
zeroize = "1.8.2"

[dev-dependencies]
# Only for tests: RSA-encrypting a canned organisation key needs a rand_core 0.6 RNG.
rand_08 = { package = "rand", version = "0.8" }
