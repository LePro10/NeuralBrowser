[package]
name = "neural_core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NeuralBrowser platform-independent core (storage, input resolution)"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi = { workspace = true }
rusqlite = { version = "0.42", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
adblock = { version = "0.13.5", default-features = false, features = ["content-blocking", "css-validation"] }
serde_json = "1"
